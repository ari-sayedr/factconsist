[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ari-sayedr-factconsist"
version = "0.1.0"
description = "对内容做归一化与分片比对，找出生成的事实一致性上的重复项并按相似度归并"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "ari-sayedr" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://ari-sayedr.github.io"
Repository = "https://github.com/ari-sayedr/factconsist"
Issues = "https://github.com/ari-sayedr/factconsist/issues"

[project.scripts]
factconsist = "factconsist:main"

[tool.setuptools]
py-modules = ["factconsist"]
